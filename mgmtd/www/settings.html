<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pretzel</title>
  <link rel="stylesheet" href="css/main.css" />
  <!-- Pre-paint: stamp the theme (and the collapsed rail) on <html> before the first frame, so the
       page never flashes the wrong palette on its way to the right one. -->
  <script>try{var t=localStorage.getItem('theme');if(t!=='dark'&&t!=='light')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.setAttribute('data-theme',t);if(localStorage.getItem('sidebarCollapsed')==='true')document.documentElement.classList.add('sb-init-collapsed')}catch(e){}</script>
</head>
<body>
<div class="app-shell" id="appShell">

  <aside class="sidebar" id="sidebar"><!-- populated by core/nav.js --></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="rail-toggle" id="railToggle">
    <button class="rail-toggle-btn" id="railToggleBtn" aria-label="Open sidebar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
  </div>

  <div class="content-wrap">
    <header class="page-topbar" id="pageTopbar"><!-- populated by core/topbar.js --></header>
    <main class="content-body" id="contentBody"></main>
  </div>

</div>
<!-- Core, in dependency order: the session guard runs first because a page that renders
     before it knows the session is valid has already shown the previous person's data; utils
     before nav because nav draws on it; topbar after nav because the console's shape is nav's
     to define; boot last, because boot is the only file that runs anything. -->
<script src="js/core/session.js"></script>
<script src="js/core/utils.js"></script>
<script src="js/core/nav.js"></script>
<script src="js/core/topbar.js"></script>
<script src="js/core/chrome.js"></script>
<script src="js/core/boot.js"></script>
<!-- Column sort, per-column filters and search for every table below. Loads before the tab modules
     because each one builds its table from it at module scope. -->
<script src="js/table-tools.js"></script>
<!-- Shared dialog surfaces. Nothing below builds its own overlay: one modal element carries the
     review diff, the running-config viewer, every confirmation and every device test. -->
<script src="js/ui/modal.js"></script>
<script src="js/ui/diff.js"></script>
<script src="js/ui/device-test.js"></script>
<!-- The staging layer, in dependency order: the draft store, the registry that reads it, then the
     two flows that end a candidate. Loaded before the tab modules because each one registers a
     provider at module scope. -->
<script src="js/settings/draft.js"></script>
<script src="js/settings/staging.js"></script>
<script src="js/settings/review.js"></script>
<script src="js/settings/revert.js"></script>
<!-- Configuration is one page with two levels of tabs (see PAGES.settings in core/nav.js). Every tab
     module loads here: each renders into #contentBody only when its own tab is active, but keeps
     its data + staged state resident so cross-references (site names, profile labels, endpoint
     and object pickers) resolve from any tab and the Config Review count spans all domains.
     operation/techdoc are read-only tabs with no staging provider. Splitting these across pages
     would break the shared registry. -->
<script src="js/ai-provider.js"></script>
<script src="js/ai-route.js"></script>
<script src="js/sites.js"></script>
<script src="js/config.js"></script>
<script src="js/api-keys.js"></script>
<script src="js/endpoints.js"></script>
<script src="js/api-connectors.js"></script>
<script src="js/users.js"></script>
<script src="js/operation.js"></script>
<script src="js/techdoc.js"></script>
<script src="js/benchtest-card.js"></script>
<script src="js/ai-model-card.js"></script>
</body>
</html>
