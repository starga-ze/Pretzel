<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pretzel</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/chatbot.css" />
  <!-- Pre-paint: stamp the theme (and the collapsed rail) on <html> before the first frame, so the
       page never flashes the wrong palette on its way to the right one. -->
  <script>try{var t=localStorage.getItem('theme');if(t!=='dark'&&t!=='light')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.setAttribute('data-theme',t);document.documentElement.classList.add('sb-init-collapsed')}catch(e){}</script>
</head>
<body class="page-chatbot">
<div class="app-shell" id="appShell">

  <aside class="sidebar" id="sidebar"><!-- populated by core/nav.js --></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="rail-toggle" id="railToggle">
    <button class="rail-toggle-btn" id="railToggleBtn" aria-label="Open sidebar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
  </div>

  <div class="content-wrap">
    <header class="page-topbar" id="pageTopbar"><!-- populated by core/topbar.js --></header>
    <main class="content-body" id="contentBody"></main>
  </div>

</div>
<!-- Core, in dependency order: the session guard runs first because a page that renders
     before it knows the session is valid has already shown the previous person's data; utils
     before nav because nav draws on it; topbar after nav because the console's shape is nav's
     to define; boot last, because boot is the only file that runs anything. -->
<script src="js/core/session.js"></script>
<script src="js/core/utils.js"></script>
<script src="js/core/nav.js"></script>
<script src="js/core/topbar.js"></script>
<script src="js/core/chrome.js"></script>
<script src="js/core/boot.js"></script>
<script src="js/chatbot.js"></script>
</body>
</html>
